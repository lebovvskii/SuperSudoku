name: Verify SuperSudoku
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Logic, storage and API tests
        run: npm run check
      - name: Build PWA
        run: npm run build
      - name: Install browser QA tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser, mobile and offline tests
        run: |
          node scripts/serve.mjs > /tmp/supersudoku-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:4173/ > /dev/null && break || sleep 1; done
          npm run test:e2e
      - name: Save browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
